schema = 1
id = "vag-ppe"
name = "VAG PPE platform"
description = "Gateway and tyre-pressure module header/DID candidates for VAG's PPE platform."
protocol = "6"
vehicles = ["Audi A6 Avant e-tron (tested)"]

[[sources]]
title = "OBDb Porsche Macan Electric"
url = "https://github.com/OBDb"
license = "CC-BY-SA-4.0"

[[sources]]
title = "Own discovery"
url = "https://github.com/noctunix/didscout"
license = "own discovery"

